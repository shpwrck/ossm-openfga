apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - egress-gateway.yaml
  - istio-routing.yaml
  - authorization-policy.yaml
  - network-policy.yaml
# In addition, scripts/install-egress.sh patches the Istio CR to
# outboundTrafficPolicy.mode: REGISTRY_ONLY — unknown external hosts become
# unroutable mesh-wide (the coarse backstop under OpenFGA's fine-grained layer).
