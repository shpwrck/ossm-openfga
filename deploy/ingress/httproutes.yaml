# Two HTTPRoutes to the same backend, split by path — because they are
# DISTINCT authorization objects in OpenFGA: route:storefront (public to any
# authenticated user) and route:storefront-admin (platform team only). Each
# gets its own AuthPolicy naming its own object.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront-admin
  namespace: ingress-demo
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: {type: PathPrefix, value: /admin}
      backendRefs:
        - name: storefront
          namespace: demo
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
  namespace: ingress-demo
spec:
  parentRefs:
    - name: demo-gw
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: storefront
          namespace: demo
          port: 8080
