# Gateway API gateway on the mesh's `istio` GatewayClass — the SAME Envoy
# data plane as the mesh, so one control plane serves both demos. Plain HTTP
# listener: keeps the demo free of TLSPolicy/DNSPolicy prerequisites
# (cert-manager, cloud DNS credentials); reach it by its LB address.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
  namespace: ingress-demo
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
